<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; base-uri 'none'; connect-src 'none'; form-action 'none'; frame-src 'self'; img-src 'self' data:; media-src 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';"
    />
    <title>Last Epoch Overlay</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-mode="click-through">
    <main id="content-box" aria-label="Published overlay content">
      <!-- Only a complete staged revision may replace this sandboxed document. -->
      <iframe
        id="revision-content"
        title="Published overlay content"
        sandbox=""
        referrerpolicy="no-referrer"
        srcdoc="<!doctype html><html><head><meta charset=utf-8><meta http-equiv=Content-Security-Policy content=&quot;default-src 'none'; base-uri 'none'; font-src data:; form-action 'none'; img-src data: blob:; object-src 'none'; script-src 'none'; style-src 'unsafe-inline'&quot;></head><body></body></html>"
      ></iframe>
    </main>

    <!-- Kept outside the content box and hidden during ordinary play. It is
         the first-run enrollment screen until a channel is paired, and a
         small deliberate local recovery surface afterwards. -->
    <aside id="local-setup" hidden aria-label="Local setup and recovery">
      <div id="recovery-drag-handle" aria-label="Drag here to move overlay">Drag here to move overlay</div>
      <h1>Local setup</h1>
      <p>
        Published content is passive. Use this mode only to enroll or recover
        the local overlay, then return to click-through before playing.
      </p>

      <section id="enrollment-form" hidden aria-label="Enroll this overlay">
        <h2>Enroll this overlay</h2>
        <label for="mailbox-url">Mailbox URL</label>
        <input id="mailbox-url" type="text" placeholder="https://mailbox.example.com" autocomplete="off" />
        <label for="client-name">This device's name</label>
        <input id="client-name" type="text" placeholder="Living room PC" autocomplete="off" />
        <button id="enroll-btn" type="button">Enroll</button>
      </section>

      <section id="enrollment-status" hidden aria-label="Enrollment status">
        <h2 id="enrollment-heading"></h2>
        <p id="enrollment-detail"></p>
        <p id="pairing-code" aria-label="Pairing code" hidden></p>
        <button id="re-enroll-btn" type="button">Re-enroll (retarget)</button>
      </section>

      <p id="enrollment-error" role="alert" hidden></p>

      <button id="resume-content" type="button">Return to click-through</button>
      <button id="quit-overlay" type="button">Quit overlay</button>
      <div id="recovery-resize-grip">Drag corner to resize</div>
    </aside>

    <!-- Shown only for clipped published content. -->
    <span id="overflow-warning" role="status" aria-label="Published content is clipped" hidden>!</span>

    <script type="module" src="app.js"></script>
  </body>
</html>
