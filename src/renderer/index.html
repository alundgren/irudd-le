<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>Last Epoch Overlay</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-mode="click-through">
    <!-- Everything visible lives in .overlay; <body> stays transparent so the
         game shows through around the rounded corners. -->
    <div class="overlay">
      <header class="titlebar">
        <span class="dot" title="Interaction mode"></span>
        <span class="title">Last Epoch Overlay</span>
        <span class="mode-label" id="mode-label">click-through</span>
        <button class="icon-btn" id="quit-btn" title="Quit overlay">×</button>
      </header>

      <nav class="tabs" id="tabs">
        <button class="tab is-active" data-panel="build">Build</button>
        <button class="tab" data-panel="notes">Notes</button>
        <button class="tab" data-panel="ask" disabled title="Coming in v2">
          Ask
        </button>
        <button class="tab" data-panel="vision" disabled title="Coming in v3">
          Vision
        </button>
      </nav>

      <main class="content" id="content">
        <!-- Placeholder build planner. Structure is what matters here: a
             scrollable list of grouped rows, the shape real skill/passive data
             will take later. -->
        <section class="panel is-active" data-panel="build">
          <div class="summary">
            <div class="summary-row">
              <span>Class</span><strong>Sentinel / Paladin</strong>
            </div>
            <div class="summary-row">
              <span>Level</span><strong>84</strong>
            </div>
            <div class="summary-row">
              <span>Target</span><strong>Corruption 300</strong>
            </div>
          </div>
          <div id="tree"></div>
        </section>

        <section class="panel" data-panel="notes">
          <ul class="notes" id="notes"></ul>
          <label class="field">
            <span>Scratch note</span>
            <input
              type="text"
              id="note-input"
              placeholder="Type here to test typing…"
            />
          </label>
        </section>

        <section class="panel" data-panel="ask">
          <p class="stub">Local model chat lands in v2 (Ollama).</p>
        </section>

        <section class="panel" data-panel="vision">
          <p class="stub">Screen-aware suggestions land in v3.</p>
        </section>
      </main>

      <footer class="statusbar">
        <span
          class="update-status"
          id="update-status"
          title="Release status"
          aria-live="polite"
        >
          update: idle
        </span>
        <button class="link-btn" id="passthrough-btn">
          Back to click-through
        </button>
        <span class="hint" id="hint"></span>
      </footer>
    </div>

    <!-- Compiled from app.ts into build/renderer/ by `pnpm compile`. -->
    <script type="module" src="app.js"></script>
  </body>
</html>
