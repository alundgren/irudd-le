packages:
  - apps/*
  - packages/*

# pnpm 10+ blocks postinstall scripts unless a package is allowed here.
# Electron's postinstall is what downloads the actual Electron binary from
# electronjs.org, so without this the app cannot start at all.
allowBuilds:
  electron: true
  # Only needed for Squirrel.Windows packaging; this project uses nsis +
  # portable targets instead, so its native build is not worth running.
  electron-winstaller: false
